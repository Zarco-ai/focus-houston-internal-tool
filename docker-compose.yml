
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: focus
      POSTGRES_PASSWORD: focus-local-only
      POSTGRES_DB: focus_dev
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - focus_pgdata:/var/lib/postgresql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focus -d focus_dev"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  focus_pgdata:
