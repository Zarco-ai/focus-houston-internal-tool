
databases:
  - name: focus-demo-db
    plan: free
    region: ohio
    databaseName: focus
    user: focus
    postgresMajorVersion: "18"
    ipAllowList: []

services:
  - type: web
    name: focus-demo
    runtime: python
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /healthz

    buildCommand: pip install --require-hashes -r requirements.lock

    startCommand: flask --app wsgi db upgrade && flask --app wsgi catalog load-if-empty && gunicorn wsgi:app

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: focus-demo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: FORM_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: REPORT_SHEET_ID
        sync: false
