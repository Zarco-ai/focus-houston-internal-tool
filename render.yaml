# Render Blueprint: the services this app runs on, declared in one file.
# Checked against Render's docs on 2026-10-20 (blueprint-spec, free, deploys,
# python-version). Setup steps: docs/GOOGLE_SIGN_IN_SETUP.md; full deploy
# guide (DEPLOY.md) comes with production in Phase 9.
#
# Right now this declares STAGING only: a copy of the app that never holds
# real data, on Render's free instance types, to find hosting problems early.
# Production (paid instances, migrations as a pre-deploy command) is added in
# Phase 9, after you approve the instance types in
# docs/PRODUCTION_DESIGN.md 10.1.
#
# What "free" means here, so nobody is surprised:
#   * The web service sleeps after 15 minutes without visitors and takes
#     about a minute to wake. Fine for staging; the reason production is paid.
#   * The database EXPIRES 30 days after it is created (then a 14-day grace
#     period before deletion), and has no backups. Staging data is throwaway
#     by design. Only one free database may exist per workspace.
#   * Free web services can't run a pre-deploy command, so staging runs the
#     migrations at the start of its start command instead. Production will
#     use preDeployCommand, so a failed migration stops the deploy and the
#     previous version keeps running.
#
# Secrets are never in this file. SECRET_KEY is generated by Render; the
# Google credentials and ADMIN_EMAILS are typed into the dashboard once
# (sync: false) and are never written here, because this repository can be
# read by anyone who can read the code.

databases:
  - name: focus-demo-db
    plan: free
    region: ohio            # same region as the web service: Render's private
                            # network only connects services within one region
    databaseName: focus
    user: focus
    postgresMajorVersion: "18"   # matches docker-compose.yml and the tests
    ipAllowList: []         # no connections from the internet at all; only
                            # the web service, over Render's private network

services:
  - type: web
    name: focus-demo
    runtime: python
    plan: free
    region: ohio
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /healthz

    # --require-hashes: every package must match the hash in requirements.lock,
    # so a tampered download fails the build instead of being installed.
    buildCommand: pip install --require-hashes -r requirements.lock

    # Staging only: migrations first, then the catalog (loaded ONLY into an
    # empty database -- once it exists, the app is where it lives), then the
    # server. (No pre-deploy command on free instances -- see above.)
    startCommand: flask --app wsgi db upgrade && flask --app wsgi catalog load-if-empty && gunicorn wsgi:app

    envVars:
      # No FOCUS_ENV: unset means PRODUCTION configuration. Staging runs the
      # exact configuration production will, refusing to start without its
      # secrets.
      - key: DATABASE_URL
        fromDatabase:
          name: focus-demo-db
          property: connectionString   # the internal URL; the app adds
                                       # sslmode=require itself
      - key: SECRET_KEY
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      # The Google Form sync (Phase 6, docs/GOOGLE_FORM_SETUP.md). Optional:
      # without them the Responses page says the sync isn't set up. On
      # STAGING these point at a TEST copy of the form and its Sheet, never
      # the real one -- staging never holds real mothers' answers.
      - key: FORM_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      # The report Sheet (D9-11, docs/GOOGLE_REPORT_SHEET_SETUP.md). Optional.
      - key: REPORT_SHEET_ID
        sync: false
